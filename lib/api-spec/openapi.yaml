openapi: 3.1.0
info:
  title: Kynex API
  version: 0.1.0
  description: >
    The single contract between every Kynex app (web, wrapped phone app) and
    the server. Change this file first, then run `pnpm codegen` to regenerate
    the client hooks and the server's request/response validators.
servers:
  - url: /api
paths:
  /health:
    get:
      operationId: getHealth
      summary: Is the server running and can it reach the database?
      tags: [system]
      responses:
        "200":
          description: Status of the server and database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: The server is running but the database is not reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/sign-in:
    post:
      operationId: signIn
      summary: Sign in with email and password. Sets the session cookie.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          description: Email or password is wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "423":
          description: Too many wrong passwords; the account is locked for a while.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Locked"
  /auth/sign-out:
    post:
      operationId: signOut
      summary: Sign this device out.
      tags: [auth]
      responses:
        "204":
          description: Signed out (also returned if already signed out).
  /auth/me:
    get:
      operationId: getMe
      summary: Who is signed in on this device?
      tags: [auth]
      responses:
        "200":
          description: The signed-in person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/SignedOut"
  /admin/users:
    get:
      operationId: listUsers
      summary: Every account in the admin's clinic.
      tags: [admin]
      responses:
        "200":
          description: Accounts, admins first, then clinicians, then patients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          $ref: "#/components/responses/SignedOut"
        "403":
          $ref: "#/components/responses/NotAllowed"
  /admin/users/{userId}/reset:
    post:
      operationId: resetUser
      summary: Reset an account to fresh so its journey starts again. Signs it out everywhere and unlocks it.
      tags: [admin]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The account after the reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/SignedOut"
        "403":
          $ref: "#/components/responses/NotAllowed"
        "404":
          description: No such account in this clinic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /exercises:
    get:
      operationId: listExercises
      summary: The exercise library (clinicians and admins). Includes this clinic's hidden exercises, marked hidden.
      tags: [library]
      responses:
        "200":
          description: All exercises, grouped by body area.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseList"
        "401":
          $ref: "#/components/responses/SignedOut"
        "403":
          $ref: "#/components/responses/NotAllowed"
  /exercises/{slug}:
    get:
      operationId: getExercise
      summary: One exercise with its steps, precautions and usual dose (clinicians and admins).
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/ExerciseSlug"
      responses:
        "200":
          description: The exercise.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseDetail"
        "401":
          $ref: "#/components/responses/SignedOut"
        "403":
          $ref: "#/components/responses/NotAllowed"
        "404":
          $ref: "#/components/responses/NoSuchExercise"
  /admin/exercises/{slug}/visibility:
    put:
      operationId: setExerciseVisibility
      summary: Hide an exercise from new plans in the admin's clinic, or show it again.
      tags: [admin, library]
      parameters:
        - $ref: "#/components/parameters/ExerciseSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseVisibility"
      responses:
        "200":
          description: The exercise after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseSummary"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/SignedOut"
        "403":
          $ref: "#/components/responses/NotAllowed"
        "404":
          $ref: "#/components/responses/NoSuchExercise"
components:
  parameters:
    ExerciseSlug:
      name: slug
      in: path
      required: true
      description: The exercise's short name, e.g. glute-bridge.
      schema:
        type: string
        pattern: "^[a-z0-9-]{1,60}$"
  responses:
    Invalid:
      description: The request was not in the expected shape.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SignedOut:
      description: Not signed in (or the sign-in has expired).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotAllowed:
      description: Signed in, but this role can't do that.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoSuchExercise:
      description: No exercise with that name.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, version, environment, serverTime, database, testAccounts]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        environment:
          type: string
          enum: [development, production]
        serverTime:
          type: string
          format: date-time
        database:
          $ref: "#/components/schemas/DatabaseStatus"
        testAccounts:
          type: integer
          description: How many sign-in accounts exist (0 means DEMO_PASSWORD has not been set yet).
    DatabaseStatus:
      type: object
      additionalProperties: false
      required: [ok, kind]
      properties:
        ok:
          type: boolean
        kind:
          type: string
          description: Which database is in use.
          enum: [postgres, local-file]
        latencyMs:
          type: number
        version:
          type: string
          description: Postgres version, e.g. "16.4".
    Role:
      type: string
      enum: [patient, clinician, admin]
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          description: A message safe to show to the person.
    Locked:
      type: object
      additionalProperties: false
      required: [error, lockedUntil]
      properties:
        error:
          type: string
        lockedUntil:
          type: string
          format: date-time
    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 200
    Clinic:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Me:
      type: object
      additionalProperties: false
      required: [id, email, displayName, role, clinic, freshSince]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        clinic:
          $ref: "#/components/schemas/Clinic"
        freshSince:
          type: string
          format: date-time
          description: When this account was created or last reset to start the journey again.
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, email, displayName, role, freshSince, lastSignInAt, lockedUntil]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        freshSince:
          type: string
          format: date-time
        lastSignInAt:
          type: [string, "null"]
          format: date-time
        lockedUntil:
          type: [string, "null"]
          format: date-time
          description: Set while the account is locked after too many wrong passwords.
    UserList:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
    Text:
      type: object
      description: The same words in English and Hindi.
      additionalProperties: false
      required: [en, hi]
      properties:
        en:
          type: string
        hi:
          type: string
    Dose:
      type: object
      description: The usual amount, which a clinician can change per patient (M3).
      additionalProperties: false
      required: [sets, restSeconds]
      properties:
        sets:
          type: integer
        reps:
          type: integer
        holdSeconds:
          type: integer
        restSeconds:
          type: integer
    ExerciseSummary:
      type: object
      additionalProperties: false
      required: [slug, name, summary, region, position, view, kind, laterality, calibration, videoStatus, hidden]
      properties:
        slug:
          type: string
        name:
          $ref: "#/components/schemas/Text"
        summary:
          $ref: "#/components/schemas/Text"
        region:
          type: string
          enum: [neck, shoulder, elbow, spine, hip, knee, ankle, balance, core]
        position:
          type: string
          enum: [standing, seated, supine, prone, quadruped]
        view:
          type: string
          description: How the person stands to the camera.
          enum: [front, side]
        kind:
          type: string
          enum: [reps, hold, timed-balance]
        laterality:
          type: string
          enum: [bilateral, unilateral, alternating]
        calibration:
          type: string
          description: How far the camera's counting is proven for this exercise.
          enum: [draft, lab-tested, clinician-reviewed]
        videoStatus:
          type: string
          enum: [none, draft, approved]
        hidden:
          type: boolean
          description: Hidden in this clinic, so it can't be added to new plans.
    ExerciseDetail:
      allOf:
        - $ref: "#/components/schemas/ExerciseSummary"
        - type: object
          required: [setup, steps, precautions, tags, dose]
          properties:
            setup:
              $ref: "#/components/schemas/Text"
            steps:
              type: array
              items:
                $ref: "#/components/schemas/Text"
            precautions:
              type: array
              items:
                $ref: "#/components/schemas/Text"
            tags:
              type: array
              items:
                type: string
            dose:
              $ref: "#/components/schemas/Dose"
    ExerciseList:
      type: object
      additionalProperties: false
      required: [exercises]
      properties:
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/ExerciseSummary"
    ExerciseVisibility:
      type: object
      additionalProperties: false
      required: [hidden]
      properties:
        hidden:
          type: boolean
